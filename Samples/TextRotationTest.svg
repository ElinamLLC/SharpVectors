<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>SVG Text Rotation Tests - Phase 1 &amp; 2</title>
  <defs>
	<style>
	  text { font-family: Arial, sans-serif; fill: black; }
	  .label { font-size: 12px; fill: #666; }
	  .title { font-size: 18px; font-weight: bold; }
	  rect { stroke: #ddd; stroke-width: 1; fill: #f9f9f9; }
	</style>
  </defs>

  <!-- Title -->
  <text x="10" y="30" class="title">SVG Text Rotation Tests (Phase 1-2)</text>

  <!-- Test 1: Uniform Rotation (Phase 1 - should work) -->
  <g id="test1">
	<rect x="10" y="50" width="380" height="120" />
	<text x="20" y="70" class="label">Test 1: Uniform Rotation (Phase 1)</text>
	<text x="20" y="90" class="label" font-size="11">SVG: &lt;text rotate="45"&gt;ROTATE&lt;/text&gt;</text>

	<!-- Rotation origin guide -->
	<circle cx="210" cy="130" r="2" fill="red" />
	<text x="175" y="145" class="label" font-size="10">Rotate center (210,130)</text>

	<!-- Expected: entire text rotated 45 degrees around point (210,130) -->
	<g transform="translate(210, 130) rotate(45)">
	  <text x="-25" y="0" font-size="20">ROTATE</text>
	</g>
  </g>

  <!-- Test 2: Per-Character Rotation (Phase 2 - enhanced) -->
  <g id="test2">
	<rect x="410" y="50" width="380" height="120" />
	<text x="420" y="70" class="label">Test 2: Per-Character Rotation (Phase 2)</text>
	<text x="420" y="90" class="label" font-size="11">SVG: &lt;tspan rotate="0 45 90 -45 0"&gt;A B C D E&lt;/tspan&gt;</text>

	<!-- Individual character rotation guides -->
	<circle cx="450" cy="130" r="2" fill="red" />
	<circle cx="500" cy="130" r="2" fill="red" />
	<circle cx="550" cy="130" r="2" fill="red" />
	<circle cx="600" cy="130" r="2" fill="red" />
	<circle cx="650" cy="130" r="2" fill="red" />

	<!-- Expected: each character rotated individually -->
	<g transform="translate(450, 130) rotate(0)">
	  <text x="-10" y="0" font-size="20">A</text>
	</g>
	<g transform="translate(500, 130) rotate(45)">
	  <text x="-10" y="0" font-size="20">B</text>
	</g>
	<g transform="translate(550, 130) rotate(90)">
	  <text x="-10" y="0" font-size="20">C</text>
	</g>
	<g transform="translate(600, 130) rotate(-45)">
	  <text x="-10" y="0" font-size="20">D</text>
	</g>
	<g transform="translate(650, 130) rotate(0)">
	  <text x="-10" y="0" font-size="20">E</text>
	</g>
  </g>

  <!-- Test 3: Position + Rotation (Phase 2) -->
  <g id="test3">
	<rect x="10" y="190" width="380" height="120" />
	<text x="20" y="210" class="label">Test 3: Position + Rotation (Phase 2)</text>
	<text x="20" y="230" class="label" font-size="11">SVG: &lt;tspan x="50 120 190" rotate="0 30 60"&gt;A B C&lt;/tspan&gt;</text>

	<!-- Combined positioning and rotation guides -->
	<circle cx="50" cy="270" r="2" fill="red" />
	<circle cx="120" cy="270" r="2" fill="red" />
	<circle cx="190" cy="270" r="2" fill="red" />

	<!-- Expected: characters positioned AND rotated -->
	<g transform="translate(50, 270) rotate(0)">
	  <text x="-10" y="0" font-size="20">A</text>
	</g>
	<g transform="translate(120, 270) rotate(30)">
	  <text x="-10" y="0" font-size="20">B</text>
	</g>
	<g transform="translate(190, 270) rotate(60)">
	  <text x="-10" y="0" font-size="20">C</text>
	</g>
  </g>

  <!-- Test 4: Rotating Last Value Applies to Remaining (Phase 2) -->
  <g id="test4">
	<rect x="410" y="190" width="380" height="120" />
	<text x="420" y="210" class="label">Test 4: Last Rotation Value (Phase 2)</text>
	<text x="420" y="230" class="label" font-size="11">SVG: &lt;tspan rotate="0 45"&gt;ABCDE&lt;/tspan&gt;</text>
	<text x="420" y="245" class="label" font-size="10">(Last rotate=45 applies to C,D,E)</text>

	<!-- Expected: A=0°, B=45°, C=D=E=45° -->
	<g transform="translate(450, 270) rotate(0)">
	  <text x="-10" y="0" font-size="20">A</text>
	</g>
	<g transform="translate(490, 270) rotate(45)">
	  <text x="-10" y="0" font-size="20">B</text>
	</g>
	<g transform="translate(530, 270) rotate(45)">
	  <text x="-10" y="0" font-size="20">C</text>
	</g>
	<g transform="translate(570, 270) rotate(45)">
	  <text x="-10" y="0" font-size="20">D</text>
	</g>
	<g transform="translate(610, 270) rotate(45)">
	  <text x="-10" y="0" font-size="20">E</text>
	</g>
  </g>

  <!-- Test 5: Text Path with Rotation (Phase 3) -->
  <g id="test5">
	<rect x="10" y="330" width="780" height="150" />
	<text x="20" y="350" class="label">Test 5: Text Path with Auto-Rotation (Phase 3)</text>
	<text x="20" y="370" class="label" font-size="11">SVG: &lt;textPath href="#curve"&gt;CURVED TEXT&lt;/textPath&gt; - Characters auto-rotate with curve</text>

	<!-- Define a curved path -->
	<defs>
	  <path id="curve" d="M 100 420 Q 300 350 550 420" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5" />
	</defs>

	<!-- Path display -->
	<use href="#curve" />

	<!-- For this test, manually position text along curve with proper rotation -->
	<!-- This would require SVG textPath support which is Phase 3 work -->
	<g transform="translate(120, 420) rotate(0)">
	  <text font-size="18">C</text>
	</g>
	<g transform="translate(180, 395) rotate(22)">
	  <text font-size="18">U</text>
	</g>
	<g transform="translate(280, 360) rotate(45)">
	  <text font-size="18">R</text>
	</g>
	<g transform="translate(380, 370) rotate(25)">
	  <text font-size="18">V</text>
	</g>
	<g transform="translate(480, 410) rotate(-20)">
	  <text font-size="18">E</text>
	</g>
	<g transform="translate(540, 425) rotate(0)">
	  <text font-size="18">D</text>
	</g>

	<text x="20" y="450" class="label" font-size="10">Note: Each character rotates to align with curve tangent</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(10, 490)">
	<text class="label" font-size="11" font-weight="bold">Phases: P1=Positioning | P2=Rotation | P3=TextPath</text>
  </g>
</svg>
